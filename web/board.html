<!doctype html>
<!-- meta 席位板（票0012）：业主眼前的一面。
     connect-es CDN 无构建——Connect 二进制流 Board.SeatBoard：
     接入一帧全态，此后只推变化帧（seat upsert/seat_gone/ticket upsert）。
     不存历史不查过去；loopback+token（secret.board.token）钦定最小暴露面。
     用法：meta serve --board-listen 127.0.0.1:9712 起网关后，浏览器开本文件，
     填 URL+token 点连接。依赖版本钉 ≥7 天：connect-web 2.2.0 / protobuf 2.16.0。 -->
<html lang="zh">
<head>
<meta charset="utf-8">
<title>meta 席位板</title>
<style>
  body { font: 14px/1.5 ui-monospace,monospace; margin: 16px; color:#222 }
  input { font: inherit; padding: 4px }
  table { border-collapse: collapse; margin: 12px 0 }
  th, td { border: 1px solid #ccc; padding: 3px 10px; text-align: left }
  th { background: #f4f4f4 }
  tr.term td { color: #999 }
  #log { max-height: 260px; overflow: auto; background:#f8f8f8; padding:8px; white-space: pre-wrap; word-break: break-all }
  .ok { color: #070 } .err { color: #c00 }
</style>
</head>
<body>
<h1>meta 席位板</h1>
<div>
  <input id="url" value="http://127.0.0.1:9712" size="24" placeholder="board_listen URL">
  <input id="token" type="password" size="20" placeholder="board token">
  <button id="go">连接</button>
  <button id="stop" disabled>断开</button>
  <span id="status"></span>
</div>
<h2>席位</h2>
<table id="seats"><thead><tr>
  <th>run</th><th>角色</th><th>壳/模型</th><th>票</th><th>stage</th><th>附言</th><th>用量(尝试/累计)</th>
</tr></thead><tbody></tbody></table>
<h2>票</h2>
<table id="tickets"><thead><tr>
  <th>id</th><th>相位</th><th>冻结</th><th>累计/硬顶</th><th>标题</th>
</tr></thead><tbody></tbody></table>
<h2>帧日志</h2>
<pre id="log"></pre>

const Board = metaFd.services.find(s => s.typeName === "meta.v1.Board");
const BoardFrame = metaFd.messages.find(m => m.typeName === "meta.v1.BoardFrame");

const $ = id => document.getElementById(id);
const seats = new Map(), tickets = new Map();
let abort = null;

function esc(s) { const d = document.createElement("td"); d.textContent = s; return d; }

function render() {
  const sb = $("seats").querySelector("tbody"); sb.replaceChildren();
  for (const r of seats.values()) {
    const tr = document.createElement("tr");
    tr.append(
      esc(r.runId), esc(r.role), esc(r.shell + (r.model ? "/" + r.model : "")),
      esc(r.ticketId), esc(r.stage || ""), esc(r.note || ""),
      esc(`${r.used}/${r.cap || "—"} · ${r.usedTotal}/${r.hardCap || "—"}`));
    sb.append(tr);
  }
  const tb = $("tickets").querySelector("tbody"); tb.replaceChildren();
  for (const r of tickets.values()) {
    const tr = document.createElement("tr");
    if (r.phase === "完成" || r.phase === "作废") tr.className = "term";
    tr.append(esc(r.id), esc(r.phase), esc(r.budgetFrozen ? "冻" : ""),
      esc(`${r.usedTotal}/${r.hardCap || "—"}`), esc(r.title || ""));
    tb.append(tr);
  }
}

function logline(tag, obj) {
  $("log").textContent += tag + " " + JSON.stringify(obj) + "\n";
  $("log").scrollTop = $("log").scrollHeight;
}

$("go").onclick = async () => {
  $("go").disabled = true; $("stop").disabled = false;
  $("status").className = ""; $("status").textContent = "连接中…";
  abort = new AbortController();
  try {
    const transport = createConnectTransport({ baseUrl: $("url").value });
    const client = createClient(Board, transport);
    const stream = client.seatBoard({ token: $("token").value },
      { signal: abort.signal });
    for await (const f of stream) {
      const b = f.body;
      switch (b.case) {
        case "full":
          seats.clear(); tickets.clear();
          for (const s of b.value.seats) seats.set(s.runId, s);
          for (const t of b.value.tickets) tickets.set(t.id, t);
          $("status").className = "ok";
          $("status").textContent = `已连接 seats=${b.value.seats.length} tickets=${b.value.tickets.length}`;
          break;
        case "seatUpsert": seats.set(b.value.runId, b.value); break;
        case "seatGone": seats.delete(b.value.runId); break;
        case "ticketUpsert": tickets.set(b.value.id, b.value); break;
      }
      render();
      logline(b.case, toJson(BoardFrame, f));
    }
    $("status").textContent = "流终";
  } catch (e) {
    $("status").className = "err";
    $("status").textContent = "断/拒: " + (e && e.message ? e.message : e);
  } finally {
    $("go").disabled = false; $("stop").disabled = true;
  }
};
$("stop").onclick = () => { if (abort) abort.abort(); };
</script>
</body>
</html>
