syntax = "proto3";

package meta.v1;

import "google/protobuf/duration.proto";

option go_package = "meta/internal/pb/metav1";

// 席位面：unix socket 双向流（总设计 §12）。首帧必为 RunAuth。
service SeatGateway {
  rpc Attach(stream SeatMsg) returns (stream GatewayMsg);
}

// 收养面：席位在 per-seat UDS 上暴露，仅供网关重启收养（§5.1）。
// 首帧＝网关出示 run_token；席位验不过即拒。
service SeatAdopt {
  rpc Adopt(AdoptAuth) returns (AdoptAck);
}

// 前端面：席位板（总设计 §9/§12，票0012）——业主眼前的一面。
// 接入即一帧全态，此后只推变化帧；不存历史不查过去（历史归 DB 审计面）。
// 同一实现在两处暴露：board_listen TCP 走 Connect 二进制（浏览器径），
// unix socket 走 gRPC 注册（meta board --socket 验收径）。
service Board {
  rpc SeatBoard(BoardReq) returns (stream BoardFrame);
}

// 管理面：同 unix socket 上的管理与只读导出口（阶段 1 手工径/smoke 用）。
// 一切写径仍经网关——CLI 不直连 DB（禁区#6 唯一写者）。
service AdminGateway {
  rpc CreateTicket(NewTicket) returns (Ack);
  rpc Dispatch(DispatchReq) returns (Ack);   // 派席位：票面起点→走到已派→壳路由 spawn
  rpc SetBudget(BudgetReq) returns (Ack);
  rpc Budget(TicketRef) returns (BudgetMsg);
  rpc Phase(TicketRef) returns (PhaseMsg);
  rpc Events(TicketRef) returns (EventList); // 判决史/事件审计径
  rpc EventsAfter(EventCursor) returns (EventList); // 水位游标回读（播报员补报径）
  rpc Runs(TicketRef) returns (RunList);     // seat_run 取证径
  rpc Observe(Empty) returns (stream ObsEvent); // 事件观察口导出
  rpc RetroVerdict(RetroReq) returns (Ack);  // 回翻件：滞留待审票一次性机械补录
  rpc Ping(Empty) returns (Ack);             // 健康核验径（meta ping / meta-probe.sh）
  rpc IssueCeoToken(CeoTokenReq) returns (CeoTokenResp); // `meta ceo` 交互面开 run：provenance=terminal
}

// CEO 面（总设计 §12 钦定五 RPC）。一切请求带 run_token——首验 role=CEO 活 run；
// provenance 一律盖自 run 行，请求自报不认（D9 机械牙）。
service CeoGateway {
  rpc Events(Subscribe) returns (stream EventItem); // 订阅＝CEO 锁登记（一人订阅在第二拒，EOF 除名）
  rpc SubmitRequirement(Requirement) returns (TicketRef); // 立需求票（spec 部分栏）＋requirement 事件
  rpc Rule(Ruling) returns (RuleAck);              // void（须重述确认）|budget_raise|redirect
  rpc Inquire(Inquiry) returns (Ack);              // 质询→起 CTO adjunct 诊断实例（只产报告不产票）
  rpc Memory(stream MemoryOp) returns (stream MemoryOp); // ceo_memory 读写流
}

message SeatMsg {
  oneof body {
    RunAuth auth = 1;
    Claim claim = 2;
    Progress progress = 3;
    Usage usage = 4;
    Deliver deliver = 5;
    PermissionReply permission_reply = 6;
    Yield yield = 7;
    SecretReq secret_req = 8;
    Rule rule = 9; // 裁决回流帧（adjunct 裁决席专用，§1.4）
    ExecReq exec_req = 10; // 命令代跑请求（部署闸：role=CTO+票相位=部署中+非 adjunct，缺一即拒）
    SeatAdmin admin = 11; // 立票/填spec/派工帧（role==CTO 非 adjunct 机械闸，§1.5）
  }
}

message GatewayMsg {
  oneof body {
    Ticket ticket = 1;
    PermissionAsk permission_ask = 2;
    Abort abort = 3;
    Extend extend = 4;
    SecretResp secret_resp = 5;
    Ack ack = 6; // Deliver 回执：席位等执再退，防尾帧丢在传输缓冲
    ExecResp exec_resp = 7; // 代跑回执：退码+输出路径+尾段（cmd_run 同文）
    Ack admin_resp = 8; // SeatAdmin 回执
  }
}

message RunAuth {
  string run_token = 1;
}

message Claim {
  string ticket_id = 1;
}

message Progress {
  string stage = 1; // 调查|设计|写码|自测|提交|交付
  string note = 2;
}

message Usage {
  int64 tokens_used = 1;
}

message Deliver {
  string ref = 1;     // 交付 commit/支名；审计席＝判决档 ref
  string note = 2;
  string verdict = 3; // 审计判决：审计席必填 pass|reject，余角色必须空
}

// Rule 裁决回流帧：adjunct 裁决席（role=CTO）经 META_RULE 哨兵上报。
message Rule {
  string action = 1; // kill_requeue|defer
  string note = 2;   // 裁决理由
}

// ExecReq 命令代跑（票0010 §10/B2/D1）：席→网关。step 是项目配方步名
// （integrate|check|deploy|probe|rollback），配方外步名不得代跑。
message ExecReq {
  string step = 1;
  string ref = 2; // 交付 ref（支/commit）；空＝网关自取该票最近 deliver 事件 ref
}

// ExecResp 代跑回执（网关→席）：与 cmd_run 行同文。exit_code<0＝
// 闸拒/起不来/超时杀（note 带因），非命令退码。
message ExecResp {
  string step = 1;
  int32 exit_code = 2;
  string out_path = 3; // 输出全文落盘（run/exec/）；tail 是尾段
  string tail = 4;
  string note = 5;
}

message PermissionReply {
  string ask_id = 1;
  bool allow = 2;
}

message Yield {
  string kind = 1; // 环境|设计漂移|受阻|票面歧义
  string reason = 2;
}

message SecretReq {
  string name = 1;
}

message Ticket {
  string id = 1;
  string title = 2;
  bytes spec = 3; // 序列化 TicketSpec（票面八栏全量，§6.1 缺一不派）
}

// TicketSpec 票面八栏全量入库（票0003）：创建票时由票面 markdown 解析落 spec BLOB；
// 注入机组装席位提示前缀时出 DB 渲染。判决史初值随票入，动态驳回/Yield 由
// ticket_event（reject/yield）在注入时追加，不在此冻结。
message TicketSpec {
  string goal = 1;         // 1. 目标
  string why = 2;          // 2. 为什么
  string scope = 3;        // 3. 范围内
  string out_of_scope = 4; // 4. 范围外（禁线）
  string refs = 5;         // 5. 设计引用
  string anchors = 6;      // 6. 验收锚
  string verify = 7;       // 7. 验证命令
  string deliver = 8;      // 8. 交付形制
  string appendix = 9;     // 附（预算/优先级/依赖票）
  string verdicts = 10;    // 判决史（创建时初值，常为「空」）
}

message PermissionAsk {
  string ask_id = 1;
  string what = 2;
}

message Abort {
  string reason = 1;
}

message Extend {
  int64 tokens = 1;
}

message SecretResp {
  string name = 1;
  bytes value = 2;
  bool denied = 3;
}

// SeatAdmin 席位流内管理帧（§1.5）：CTO-A 写径随席位流走——权限随角色收，
// D-24 降权迁移后天然存活（CLI 管理径 socket 属主权会把它关在门外）。
message SeatAdmin {
  oneof action {
    FillSpec fill_spec = 1;       // 回填本票八栏（限派发票自身施工中）
    NewTicket create_ticket = 2;  // 立子票（spec 全量；created 事件沿用本 run 戳）
    DispatchReq dispatch = 3;     // 派子票（role=CEO 由 DispatchSeat 永拒）
  }
}

// FillSpec 回填票面：spec_md＝票面 markdown 原文，网关经 inject.ParseTicketMD
// 解析+缺一不派闸校验后 marshal 入库——席侧不落 proto 序列化职责。
message FillSpec {
  string ticket_id = 1;
  bytes spec_md = 2;
}

message AdoptAuth {
  string run_token = 1;
}

message AdoptAck {
  bool accepted = 1;
  string ticket_id = 2;
}

// ---------- 管理面 ----------

message NewTicket {
  string id = 1;
  string title = 2;
  bytes spec = 3; // 序列化 TicketSpec（可空——无 spec 票仅可 --prompt-file 覆盖径派发）
  int64 attempt_cap = 4; // 每次尝试内 token 上限（§5.5）；0=不设
  int64 hard_cap = 5;    // 票级累计硬顶；0=不设
}

message DispatchReq {
  string ticket_id = 1;
  string role = 2;
  string prompt_file = 3;  // 席位提示词文件（一律文件径，不内联）
  string work_dir = 4;
  string prefer_shell = 5; // 非空＝该壳尝试提首（smoke 指定径）
  bool adjunct = 6;        // 辅助席（裁决/诊断）：不占相位，必给 prompt_file
  string provenance = 7;   // 触发事件行的 provenance 透传（caster 自动带；spawn 盖进 seat_run）
}

message BudgetReq {
  string ticket_id = 1;
  int64 attempt_cap = 2;
  int64 hard_cap = 3;
}

message TicketRef {
  string id = 1;
}

message Ack {
  bool ok = 1;
  string note = 2;
}

message PhaseMsg {
  string phase = 1;
  bool budget_frozen = 2;
}

message BudgetMsg {
  int64 cap = 1;        // 尝试内上限
  int64 used = 2;       // 本次尝试已计
  int64 hard_cap = 3;   // 票级硬顶
  int64 used_total = 4; // 票级累计（单调递增）
}

message EventItem {
  int64 id = 1;
  string kind = 2;
  string from_phase = 3;
  string to_phase = 4;
  string actor = 5;
  string note = 6;
  int64 at_unix_nano = 7;
  string ticket_id = 8;
  string role = 9; // 决策41：actor 为 run_id 时经 seat_run 映射带出，否则空
  string provenance = 10; // 事件行 provenance 列透传（D9：CEO 链盖戳可查）
}

message EventCursor {
  int64 since_id = 1; // 已处理最大 ticket_event.id（水位）
  int32 limit = 2;    // 页大小；0/负＝服务端缺省
}

message RetroReq {
  string ticket_id = 1;
  string verdict = 2; // pass|reject
  string ref = 3;     // 判决档/决策号指证（必填——无指证的回翻＝无 provenance）
}

message EventList {
  repeated EventItem items = 1;
}

message RunItem {
  string run_id = 1;
  string role = 2;
  string shell = 3;
  int32 pid = 4;
  int32 exit_code = 5;
  bool dead = 6;
  bool attached = 7;
  bool adopted = 8;
  int64 started_at = 9;
  int64 exited_at = 10;
  bool adjunct = 11;
}

message RunList {
  repeated RunItem items = 1;
}

message ObsEvent {
  string kind = 1;
  string ticket_id = 2;
  string run_id = 3;
  string role = 4;
  string note = 5;
  string provenance = 6;
}

// ---------- 前端面：席位板消息（票0012） ----------

// BoardReq 接入请求：token 对 secret.board.token——行缺/不符一律
// Unauthenticated（fail closed，§3.4 前端面 token 闸）。
message BoardReq {
  string token = 1;
}

// BoardFrame 一帧：首帧恒为 full（全态投影），此后只推变化帧。
// 变化帧内容恒为 DB 现态重读投影——幂等重放安全（事件丢了重发不脏板）。
message BoardFrame {
  oneof body {
    BoardFull full = 1;
    SeatRow seat_upsert = 2;
    SeatGone seat_gone = 3;
    TicketRow ticket_upsert = 4;
  }
}

message BoardFull {
  repeated SeatRow seats = 1;     // 全部活 run（dead=0）
  repeated TicketRow tickets = 2; // 全部非终态票
}

// SeatRow 一席现态（§9：角色/壳/模型/所领票/当前 stage/预算用量）。
message SeatRow {
  string run_id = 1;
  string role = 2;
  string shell = 3;     // 壳名
  string model = 4;     // 壳模型（登记表 label 第二段；无则空）
  string ticket_id = 5;
  string stage = 6;     // 最近进度帧 stage（无则空）
  string note = 7;      // 最近进度帧附言
  int64 used = 8;       // 尝试内已用（毛值 token）
  int64 cap = 9;        // 尝试内帽
  int64 used_total = 10; // 票级累计
  int64 hard_cap = 11;  // 票级硬顶
  bool attached = 12;
  bool adjunct = 13;
  int64 started_at_unix_nano = 14;
}

message SeatGone {
  string run_id = 1;
}

// TicketRow 一票现态投影（含终态相位 upsert——板只上行不删行，
// 终态由前端滤；票无副本，一切读 DB）。
message TicketRow {
  string id = 1;
  string title = 2;
  string phase = 3;
  bool budget_frozen = 4;
  int64 used_total = 5;
  int64 hard_cap = 6;
}

message Empty {}

// ---------- CEO 面消息（五 RPC 载荷；run_token 首验 role=CEO 活 run） ----------

message Subscribe {
  string run_token = 1;
  bool follow = 2; // false＝回放待处理队列即完（无头席排水径）；true＝随流派发
}

// Requirement 需求提交（§1.4）：立票许空 spec——goal=原文、why=定向+provenance。
message Requirement {
  string run_token = 1;
  string title = 2;
  string goal = 3;       // 需求原文
  string direction = 4;  // CEO 定向（方向/优先序/约束/边界）
  string provenance = 5; // 客户端可自报——网关盖 run 行戳，自报不认（D9）
}

// Ruling CEO 裁决：void（破坏性，须 confirm 重述确认 §3.4）/budget_raise（追加
// 硬顶解冻）/redirect（req_pending 泊车票重派 CTO）。
message Ruling {
  string run_token = 1;
  string action = 2;
  string ticket_id = 3;
  string note = 4;
  bool confirm = 5;
  int64 hard_cap = 6; // budget_raise：新票级硬顶（抬帽不清零）
}

message RuleAck {
  bool ok = 1;
  bool need_confirm = 2; // 破坏性裁决未带确认帧——须重发 confirm=true
  string note = 3;
}

// Inquiry 质询（§8 质询权）：起一次 CTO adjunct 诊断实例——只产报告不产票。
message Inquiry {
  string run_token = 1;
  string ticket_id = 2; // 诊断对象票（adjunct 依附位）
  string question = 3;
}

// MemoryOp ceo_memory 流读写：put 落行（event_ref=run_id 机械盖）；
// get 按 kind 倒序回放（kind 空＝全量）；row＝响应行。
message MemoryOp {
  string run_token = 1;
  oneof op {
    MemoryPut put = 2;
    MemoryGet get = 3;
    MemoryRow row = 4;
  }
}

message MemoryPut {
  string kind = 1; // memo|decision|say 等；say→同步出 ceo_say 事件（§1.9）
  string title = 2;
  bytes content = 3;
}

message MemoryGet {
  string kind = 1;
  int32 limit = 2; // 0/负＝服务端缺省
}

message MemoryRow {
  int64 id = 1;
  string kind = 2;
  string title = 3;
  bytes content = 4;
  string event_ref = 5;   // put 时机械盖 run_id——D-22 比对基准
  string provenance = 6;  // 盖自 run 行
  int64 at_unix_nano = 7;
}

message CeoTokenReq {}

message CeoTokenResp {
  string run_id = 1;
  string run_token = 2;
}

// ---------- 播报员路由表（D-26/令#E13：事件→动作电话簿，判断永不进播报员） ----------

message RouteTable { repeated Route routes = 1; }

message Route {
  string kind = 1;            // 匹配 ticket_event.kind（精确等值；表外不动作）
  repeated Action actions = 2;
  string note = 3;
  string note_contains = 4;   // 可选：行 note 子串匹配（空＝只按 kind）
  string role = 5;            // 可选：非空则要求 EventItem.role 等值（空＝不滤，旧行语义不变）
}

message Action {
  oneof body {
    NotifyAction notify = 1;     // 调通知脚本
    DispatchAction dispatch = 2; // 调 AdminGateway.Dispatch
  }
}

message NotifyAction { string template = 1; } // 占位符 {{ticket_id}} {{kind}} {{note}} {{role}} {{action}}

message DispatchAction {
  string role = 1;
  string prompt_template = 2; // 模板文件（相对配置根）；空＝注入机径
  string work_dir = 3;
  string prefer_shell = 4;
  bool adjunct = 5;
}

// ---------- 网关配置（D-9 出码外；帽值毛口径 D-27） ----------

message GatewayConfig {
  google.protobuf.Duration progress_timeout = 1;   // 缺省 30m
  google.protobuf.Duration auth_timeout = 2;       // 5s
  google.protobuf.Duration adopt_dial_timeout = 3; // 2s
  google.protobuf.Duration stagger = 4;            // 10s
  google.protobuf.Duration quick_exit = 5;         // 20s
  int32 max_per_shell = 6;                         // 0=不限
  int64 default_attempt_cap = 7;                   // 角色行未配时的尝试内帽（毛值 token）
  int64 ticket_hard_cap = 8;                       // 票级累计硬顶缺省（毛值）
  repeated RoleBudget role_budget = 9;
  repeated ShellRow shell = 10;
  repeated ProjectSeed project = 11;               // 项目配方种子（缺 id 行才落，DB 行是活态）
  repeated string ceo_events = 12;      // CeoGateway.Events 流放行 kind 列
  repeated string ceo_spawn_kinds = 13; // 无头 CEO 化身触发 kind 列（决策54/E16）
  string ceo_prompt = 14;               // 无头席提示模板路径（{{kind}} 等占位）
  string board_listen = 15;             // 前端面 TCP 监听（127.0.0.1:<port>；空=不挂板）
}

// FeishuApp 飞书应用凭证载荷（票0013）：secret.feishu.app 行 vault.key
// 自解后的格式——网关自解不走 Secret RPC 席位径；ACL 空＝不授任何席。
message FeishuApp {
  string app_id = 1;
  string app_secret = 2;
  string owner_open_id = 3; // 白名单唯一来源：入站只认此 open_id 等值
  string chat_id = 4;       // owner chat（say/呼救出站与入站回执落点）
}

// SandboxSpec 沙箱形制（§11）：代跑执行身份——run_as 缺省＋按步覆盖。
// D1 禁网关自身用户；meta 配方的诚实妥协＝不可信码只进 check 步（metaseat），
// integrate/deploy/probe/rollback 为仓内固定脚本按步覆盖 run_as=mluser。
message SandboxSpec {
  string run_as = 1;                        // 代跑缺省用户
  map<string,string> step_run_as = 2;       // 按步覆盖（step→用户）
  google.protobuf.Duration exec_timeout = 3; // 单步超时（一次性闹钟杀）；空＝网关缺省
}

// ProjectSeed 项目配方种行（§11 子集——本票消费列）：
// 仓址/默认支/五步命令/沙箱形制；种入 project 表（已存在 id 行不动）。
message ProjectSeed {
  string id = 1;
  string repo_url = 2;          // clone 源（本机路径或远端；空＝无仓址，cwd=干净空目录）
  string default_branch = 3;
  string integrate_cmd = 4;     // 集成交付支（meta=merge 交付支）
  string check_cmd = 5;         // 检查命令（不可信票码唯一落点——run_as 必须降权）
  string deploy_cmd = 6;
  string probe_cmd = 7;
  string rollback_cmd = 8;
  SandboxSpec sandbox = 9;
}

message RoleBudget {
  string role = 1;
  int64 attempt_cap = 2;
}

message ShellRow {
  string name = 1;
  string model = 2;
  string role = 3;
  int32 priority = 4;    // 小者优先
  int64 attempt_cap = 5; // >0＝本行尝试帽覆盖角色缺省
  string note = 6;
}
