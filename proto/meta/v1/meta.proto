syntax = "proto3";

package meta.v1;

import "google/protobuf/duration.proto";

option go_package = "meta/internal/pb/metav1";

// 席位面：unix socket 双向流（总设计 §12）。首帧必为 RunAuth。
service SeatGateway {
  rpc Attach(stream SeatMsg) returns (stream GatewayMsg);
}

// 收养面：席位在 per-seat UDS 上暴露，仅供网关重启收养（§5.1）。
// 首帧＝网关出示 run_token；席位验不过即拒。
service SeatAdopt {
  rpc Adopt(AdoptAuth) returns (AdoptAck);
}

// 管理面：同 unix socket 上的管理与只读导出口（阶段 1 手工径/smoke 用）。
// 一切写径仍经网关——CLI 不直连 DB（禁区#6 唯一写者）。
service AdminGateway {
  rpc CreateTicket(NewTicket) returns (Ack);
  rpc Dispatch(DispatchReq) returns (Ack);   // 派席位：票面起点→走到已派→壳路由 spawn
  rpc SetBudget(BudgetReq) returns (Ack);
  rpc Budget(TicketRef) returns (BudgetMsg);
  rpc Phase(TicketRef) returns (PhaseMsg);
  rpc Events(TicketRef) returns (EventList); // 判决史/事件审计径
  rpc EventsAfter(EventCursor) returns (EventList); // 水位游标回读（播报员补报径）
  rpc Runs(TicketRef) returns (RunList);     // seat_run 取证径
  rpc Observe(Empty) returns (stream ObsEvent); // 事件观察口导出
  rpc RetroVerdict(RetroReq) returns (Ack);  // 回翻件：滞留待审票一次性机械补录
}

message SeatMsg {
  oneof body {
    RunAuth auth = 1;
    Claim claim = 2;
    Progress progress = 3;
    Usage usage = 4;
    Deliver deliver = 5;
    PermissionReply permission_reply = 6;
    Yield yield = 7;
    SecretReq secret_req = 8;
    Rule rule = 9; // 裁决回流帧（adjunct 裁决席专用，§1.4）
  }
}

message GatewayMsg {
  oneof body {
    Ticket ticket = 1;
    PermissionAsk permission_ask = 2;
    Abort abort = 3;
    Extend extend = 4;
    SecretResp secret_resp = 5;
    Ack ack = 6; // Deliver 回执：席位等执再退，防尾帧丢在传输缓冲
  }
}

message RunAuth {
  string run_token = 1;
}

message Claim {
  string ticket_id = 1;
}

message Progress {
  string stage = 1; // 调查|设计|写码|自测|提交|交付
  string note = 2;
}

message Usage {
  int64 tokens_used = 1;
}

message Deliver {
  string ref = 1;     // 交付 commit/支名；审计席＝判决档 ref
  string note = 2;
  string verdict = 3; // 审计判决：审计席必填 pass|reject，余角色必须空
}

// Rule 裁决回流帧：adjunct 裁决席（role=CTO）经 META_RULE 哨兵上报。
message Rule {
  string action = 1; // kill_requeue|defer
  string note = 2;   // 裁决理由
}

message PermissionReply {
  string ask_id = 1;
  bool allow = 2;
}

message Yield {
  string kind = 1; // 环境|设计漂移|受阻|票面歧义
  string reason = 2;
}

message SecretReq {
  string name = 1;
}

message Ticket {
  string id = 1;
  string title = 2;
  bytes spec = 3; // 序列化 TicketSpec（票面八栏全量，§6.1 缺一不派）
}

// TicketSpec 票面八栏全量入库（票0003）：创建票时由票面 markdown 解析落 spec BLOB；
// 注入机组装席位提示前缀时出 DB 渲染。判决史初值随票入，动态驳回/Yield 由
// ticket_event（reject/yield）在注入时追加，不在此冻结。
message TicketSpec {
  string goal = 1;         // 1. 目标
  string why = 2;          // 2. 为什么
  string scope = 3;        // 3. 范围内
  string out_of_scope = 4; // 4. 范围外（禁线）
  string refs = 5;         // 5. 设计引用
  string anchors = 6;      // 6. 验收锚
  string verify = 7;       // 7. 验证命令
  string deliver = 8;      // 8. 交付形制
  string appendix = 9;     // 附（预算/优先级/依赖票）
  string verdicts = 10;    // 判决史（创建时初值，常为「空」）
}

message PermissionAsk {
  string ask_id = 1;
  string what = 2;
}

message Abort {
  string reason = 1;
}

message Extend {
  int64 tokens = 1;
}

message SecretResp {
  string name = 1;
  bytes value = 2;
  bool denied = 3;
}

message AdoptAuth {
  string run_token = 1;
}

message AdoptAck {
  bool accepted = 1;
  string ticket_id = 2;
}

// ---------- 管理面 ----------

message NewTicket {
  string id = 1;
  string title = 2;
  bytes spec = 3; // 序列化 TicketSpec（可空——无 spec 票仅可 --prompt-file 覆盖径派发）
  int64 attempt_cap = 4; // 每次尝试内 token 上限（§5.5）；0=不设
  int64 hard_cap = 5;    // 票级累计硬顶；0=不设
}

message DispatchReq {
  string ticket_id = 1;
  string role = 2;
  string prompt_file = 3;  // 席位提示词文件（一律文件径，不内联）
  string work_dir = 4;
  string prefer_shell = 5; // 非空＝该壳尝试提首（smoke 指定径）
  bool adjunct = 6;        // 辅助席（裁决/诊断）：不占相位，必给 prompt_file
}

message BudgetReq {
  string ticket_id = 1;
  int64 attempt_cap = 2;
  int64 hard_cap = 3;
}

message TicketRef {
  string id = 1;
}

message Ack {
  bool ok = 1;
  string note = 2;
}

message PhaseMsg {
  string phase = 1;
  bool budget_frozen = 2;
}

message BudgetMsg {
  int64 cap = 1;        // 尝试内上限
  int64 used = 2;       // 本次尝试已计
  int64 hard_cap = 3;   // 票级硬顶
  int64 used_total = 4; // 票级累计（单调递增）
}

message EventItem {
  int64 id = 1;
  string kind = 2;
  string from_phase = 3;
  string to_phase = 4;
  string actor = 5;
  string note = 6;
  int64 at_unix_nano = 7;
  string ticket_id = 8;
  string role = 9; // 决策41：actor 为 run_id 时经 seat_run 映射带出，否则空
}

message EventCursor {
  int64 since_id = 1; // 已处理最大 ticket_event.id（水位）
  int32 limit = 2;    // 页大小；0/负＝服务端缺省
}

message RetroReq {
  string ticket_id = 1;
  string verdict = 2; // pass|reject
  string ref = 3;     // 判决档/决策号指证（必填——无指证的回翻＝无 provenance）
}

message EventList {
  repeated EventItem items = 1;
}

message RunItem {
  string run_id = 1;
  string role = 2;
  string shell = 3;
  int32 pid = 4;
  int32 exit_code = 5;
  bool dead = 6;
  bool attached = 7;
  bool adopted = 8;
  int64 started_at = 9;
  int64 exited_at = 10;
  bool adjunct = 11;
}

message RunList {
  repeated RunItem items = 1;
}

message ObsEvent {
  string kind = 1;
  string ticket_id = 2;
  string run_id = 3;
  string role = 4;
  string note = 5;
}

message Empty {}

// ---------- 播报员路由表（D-26/令#E13：事件→动作电话簿，判断永不进播报员） ----------

message RouteTable { repeated Route routes = 1; }

message Route {
  string kind = 1;            // 匹配 ticket_event.kind（精确等值；表外不动作）
  repeated Action actions = 2;
  string note = 3;
  string note_contains = 4;   // 可选：行 note 子串匹配（空＝只按 kind）
}

message Action {
  oneof body {
    NotifyAction notify = 1;     // 调通知脚本
    DispatchAction dispatch = 2; // 调 AdminGateway.Dispatch
  }
}

message NotifyAction { string template = 1; } // 占位符 {{ticket_id}} {{kind}} {{note}} {{role}} {{action}}

message DispatchAction {
  string role = 1;
  string prompt_template = 2; // 模板文件（相对配置根）；空＝注入机径
  string work_dir = 3;
  string prefer_shell = 4;
  bool adjunct = 5;
}

// ---------- 网关配置（D-9 出码外；帽值毛口径 D-27） ----------

message GatewayConfig {
  google.protobuf.Duration progress_timeout = 1;   // 缺省 30m
  google.protobuf.Duration auth_timeout = 2;       // 5s
  google.protobuf.Duration adopt_dial_timeout = 3; // 2s
  google.protobuf.Duration stagger = 4;            // 10s
  google.protobuf.Duration quick_exit = 5;         // 20s
  int32 max_per_shell = 6;                         // 0=不限
  int64 default_attempt_cap = 7;                   // 角色行未配时的尝试内帽（毛值 token）
  int64 ticket_hard_cap = 8;                       // 票级累计硬顶缺省（毛值）
  repeated RoleBudget role_budget = 9;
  repeated ShellRow shell = 10;
}

message RoleBudget {
  string role = 1;
  int64 attempt_cap = 2;
}

message ShellRow {
  string name = 1;
  string model = 2;
  string role = 3;
  int32 priority = 4;    // 小者优先
  int64 attempt_cap = 5; // >0＝本行尝试帽覆盖角色缺省
  string note = 6;
}
